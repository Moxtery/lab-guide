*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
.w{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{padding:28px 0 12px}
h1{font-size:1.7rem;font-weight:800;margin:0 0 4px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5}
input{width:100%;font:inherit;padding:12px 16px;border:2px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink)}
input:focus{outline:none;border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.chip{flex:none;font:inherit;font-size:.88rem;padding:5px 14px;border:1px solid var(--ln);border-radius:99px;background:var(--sf);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.chip:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h2{font-size:1.15rem;margin:26px 0 4px;padding-right:12px;border-right:4px solid var(--ac)}
.cd{font-size:.85rem;color:var(--mu);margin:0 16px 8px 0}
details{background:var(--sf);border:1px solid var(--ln);border-radius:10px;margin:8px 0}
summary{cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;list-style:none;align-items:center}
summary::-webkit-details-marker{display:none}
summary b{font-weight:600}
summary small{color:var(--mu);direction:ltr;unicode-bidi:isolate;font-size:.8rem}
.bd{padding:0 16px 14px;border-top:1px dashed var(--ln);font-size:.93rem}
.bd p{margin:8px 0 0}
.r{display:inline-block;direction:ltr;unicode-bidi:isolate;background:var(--acs);padding:0 8px;border-radius:6px;font-weight:600}
.h{color:var(--hi);font-weight:600}.l{color:var(--lo);font-weight:600}
.em{text-align:center;color:var(--mu);padding:40px 0}
footer{font-size:.8rem;color:var(--mu);border-top:1px solid var(--ln);padding-top:14px;margin-top:30px}
</style>
